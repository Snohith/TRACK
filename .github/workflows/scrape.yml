name: Auto 10-Minute StatsArena Scraper & Live Resolver

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install httpx>=0.27.0 requests>=2.31.0 brotli>=1.1.0

      - name: Run Scraper & Export Data
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          http_proxy: ""
          https_proxy: ""
        run: python scraper.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json static/data.json matches.db
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Auto-update: match data & scores [skip ci]"
            git pull --rebase -X ours origin main || true
            git push origin main || (git pull --rebase -X ours origin main && git push origin main)
          fi
