name: Auto Hourly StatsArena Scraper

on:
  schedule:
    # Run every 1 hour automatically
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper & Export Data
        run: |
          python scraper.py

      - name: Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json static/data.json matches.db
          if git diff --staged --quiet; then
            echo "No changes in match data."
          else
            git commit -m "Auto-update: Scraped latest matches & odds [skip ci]"
            git push
          fi
